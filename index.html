            <div class="main-scroll-div">
                <div>
                    <button class="icon" onclick="scroll_left()"><i class="fa-solid fa-arrow-left-long"></i></button>
                </div>

                <!-- <div>
                    <button class="icon" onclick="scroll_right()"><i class="fa-solid fa-arrow-right"></i></button>
                </div> -->
            </div>
            
            <script>
                function scroll_left() {
                    const left = document.querySelector(".scroll-images");
                    left.scrollBy(-350,0);
                }

                function scroll_right() {
                    const right = document.querySelector(".scroll-images");
                    right.scrollBy(350,0);
                }
            </script>

            <!-- Modal -->
            <div class="modal fade" id="exampleModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">

                        <div class="modal-body">

                                <div class="modal-body-content request-issue-type">

                                </div>
                                
                                
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary btn-m">Assign Engineer</button>
                            
                        </div>
                    </div>
