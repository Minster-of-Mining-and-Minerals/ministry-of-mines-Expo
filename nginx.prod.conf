events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;

    # Allow resource image uploads larger than the 1 MB default
    client_max_body_size 20m;

    server {
        listen 80;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy requests to the backend
        location / {
            proxy_pass http://backend:4006;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Serve static files directly for better performance
        location /stylesheets/ {
            alias /usr/share/nginx/html/public/stylesheets/;
        }
        location /images/ {
            alias /usr/share/nginx/html/public/images/;
        }
        location /scripts/ {
            alias /usr/share/nginx/html/public/scripts/;
        }
    }
}
